<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courses — PassUp.LK</title>
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
</head>

<body>
  <div id="site-header"></div>
  <main>
    <section class="section container" style="padding-top:64px">
      <div class="section-head">
        <h1>Our Courses</h1>
        <p>Pick a subject and start learning today.</p>
      </div>
      <div class="filter-bar" style="justify-content:center" id="filterBar">
        <button class="btn btn-dark btn-sm" data-filter="">All</button>
      </div>
      <div class="grid grid-3" id="courseGrid">
        <div class="skeleton" style="height:280px"></div>
        <div class="skeleton" style="height:280px"></div>
        <div class="skeleton" style="height:280px"></div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script type="module">
    import { renderSiteHeader } from '/assets/js/components/site-header.js';
    import { renderSiteFooter } from '/assets/js/components/site-footer.js';
    import { listPublishedCourses } from '/assets/js/services/courses.service.js';
    import { listSubjects } from '/assets/js/services/subjects.service.js';
    import { courseCardHTML } from '/assets/js/components/course-card.js';
    import { renderEmptyState, renderErrorState, qsa, escapeHTML } from '/assets/js/utils/dom.js';

    renderSiteHeader(document.getElementById('site-header'), '/courses.html');
    renderSiteFooter(document.getElementById('site-footer'));

    const grid = document.getElementById('courseGrid');
    const filterBar = document.getElementById('filterBar');
    const params = new URLSearchParams(window.location.search);
    let activeFilter = params.get('subject') || '';

    async function load() {
      grid.innerHTML = '<div class="skeleton" style="height:280px"></div>'.repeat(3);
      try {
        const courses = await listPublishedCourses({ subjectSlug: activeFilter || null });
        if (!courses.length) return renderEmptyState(grid, { icon: '📚', title: 'No courses here yet', message: 'Check back soon — new courses are added regularly.' });
        grid.innerHTML = courses.map((c) => courseCardHTML(c)).join('');
      } catch {
        renderErrorState(grid, 'Could not load courses. Please refresh.');
      }
    }

    function wireFilterButtons() {
      qsa('[data-filter]', filterBar).forEach((btn) => {
        btn.classList.toggle('btn-dark', btn.dataset.filter === activeFilter);
        btn.classList.toggle('btn-outline', btn.dataset.filter !== activeFilter);
        btn.addEventListener('click', () => {
          activeFilter = btn.dataset.filter;
          qsa('[data-filter]', filterBar).forEach((b) => {
            b.classList.toggle('btn-dark', b === btn);
            b.classList.toggle('btn-outline', b !== btn);
          });
          load();
        });
      });
    }

    // Subject buttons are built from whatever's actually in the subjects
    // table — add or remove a subject in Teacher → Subjects and this list
    // updates itself, no code change needed.
    try {
      const subjects = await listSubjects();
      filterBar.insertAdjacentHTML('beforeend', subjects.map((s) => `<button class="btn btn-outline btn-sm" data-filter="${escapeHTML(s.slug)}">${escapeHTML(s.name)}</button>`).join(''));
    } catch {
      // Filter bar is a non-essential enhancement — course list still loads without it.
    }
    wireFilterButtons();

    load();
  </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courses — PassUp.LK</title>
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
</head>

<body>
  <div id="site-header"></div>
  <main>
    <section class="section container" style="padding-top:64px">
      <div class="section-head">
        <h1>Our Courses</h1>
        <p>Pick your exam level and subject to start learning today.</p>
      </div>
      <div class="filter-bar" style="justify-content:center" id="levelBar">
        <button class="btn btn-dark btn-sm" data-level="">All Levels</button>
        <button class="btn btn-outline btn-sm" data-level="O/L">O/L</button>
        <button class="btn btn-outline btn-sm" data-level="A/L">A/L</button>
      </div>
      <div class="filter-bar" style="justify-content:center" id="subjectBar"></div>
      <div class="grid grid-3" id="courseGrid">
        <div class="skeleton" style="height:280px"></div>
        <div class="skeleton" style="height:280px"></div>
        <div class="skeleton" style="height:280px"></div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script type="module">
    import { renderSiteHeader } from '/assets/js/components/site-header.js';
    import { renderSiteFooter } from '/assets/js/components/site-footer.js';
    import { listPublishedCourses } from '/assets/js/services/courses.service.js';
    import { listSubjects } from '/assets/js/services/subjects.service.js';
    import { courseCardHTML } from '/assets/js/components/course-card.js';
    import { renderEmptyState, renderErrorState, qsa, escapeHTML } from '/assets/js/utils/dom.js';

    renderSiteHeader(document.getElementById('site-header'), '/courses.html');
    renderSiteFooter(document.getElementById('site-footer'));

    const grid = document.getElementById('courseGrid');
    const levelBar = document.getElementById('levelBar');
    const subjectBar = document.getElementById('subjectBar');
    const params = new URLSearchParams(window.location.search);

    let allSubjects = [];
    let activeLevel = params.get('level') || '';
    let activeSubjectSlug = params.get('subject') || '';

    async function loadCourses() {
      grid.innerHTML = '<div class="skeleton" style="height:280px"></div>'.repeat(3);
      try {
        const courses = await listPublishedCourses({ subjectSlug: activeSubjectSlug || null, level: activeLevel || null });
        if (!courses.length) return renderEmptyState(grid, { icon: '📚', title: 'No courses here yet', message: 'Check back soon — new courses are added regularly.' });
        grid.innerHTML = courses.map((c) => courseCardHTML(c)).join('');
      } catch {
        renderErrorState(grid, 'Could not load courses. Please refresh.');
      }
    }

    function renderSubjectBar() {
      // Subject options are scoped to the selected level — pick "O/L" and you
      // only see O/L subjects, so the list stays short as more get added.
      const scoped = activeLevel ? allSubjects.filter((s) => s.level === activeLevel) : allSubjects;
      if (activeSubjectSlug && !scoped.some((s) => s.slug === activeSubjectSlug)) activeSubjectSlug = '';

      subjectBar.innerHTML = `
      <button class="btn btn-sm ${!activeSubjectSlug ? 'btn-dark' : 'btn-outline'}" data-subject="">All Subjects</button>
      ${scoped.map((s) => `<button class="btn btn-sm ${activeSubjectSlug === s.slug ? 'btn-dark' : 'btn-outline'}" data-subject="${escapeHTML(s.slug)}">${escapeHTML(s.name)}</button>`).join('')}
    `;
      qsa('[data-subject]', subjectBar).forEach((btn) => {
        btn.addEventListener('click', () => {
          activeSubjectSlug = btn.dataset.subject;
          renderSubjectBar();
          loadCourses();
        });
      });
    }

    function wireLevelButtons() {
      qsa('[data-level]', levelBar).forEach((btn) => {
        btn.classList.toggle('btn-dark', btn.dataset.level === activeLevel);
        btn.classList.toggle('btn-outline', btn.dataset.level !== activeLevel);
        btn.addEventListener('click', () => {
          activeLevel = btn.dataset.level;
          qsa('[data-level]', levelBar).forEach((b) => {
            b.classList.toggle('btn-dark', b === btn);
            b.classList.toggle('btn-outline', b !== btn);
          });
          renderSubjectBar();
          loadCourses();
        });
      });
    }

    try {
      allSubjects = await listSubjects();
    } catch {
      // Subject filter is a non-essential enhancement — course list still loads without it.
    }
    wireLevelButtons();
    renderSubjectBar();
    loadCourses();
  </script>
</body>

</html>

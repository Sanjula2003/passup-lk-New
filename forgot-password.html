<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — PassUp.LK</title>
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/pages/auth.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-visual">
    <a href="/index.html" class="brand" style="color:#fff"><span class="brand__mark">P</span><span>PassUp<span style="color:var(--color-primary)">.LK</span></span></a>
    <p class="auth-visual__quote">"We'll help you get back into your courses in no time."</p>
  </div>
  <div class="auth-panel">
    <div class="auth-card">
      <div class="auth-card__head">
        <h2>Reset your password</h2>
        <p>Enter your email and we'll send you a reset link.</p>
      </div>
      <form id="forgotForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" type="email" id="email" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Send Reset Link</button>
      </form>
      <p class="auth-foot"><a href="/login.html">Back to Log In</a></p>
    </div>
  </div>
</div>
<script type="module">
  import { sendPasswordReset } from '/assets/js/services/auth.service.js';
  import { isValidEmail, applyFieldError, clearFieldError } from '/assets/js/utils/validators.js';
  import { toastError } from '/assets/js/utils/toast.js';

  document.getElementById('forgotForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email');
    clearFieldError(email);
    if (!isValidEmail(email.value)) { applyFieldError(email, 'Enter a valid email.'); return; }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = 'Sending…';
    try {
      await sendPasswordReset(email.value.trim());
      document.querySelector('.auth-card').innerHTML = `
        <div class="state-panel" style="padding:0">
          <div class="state-panel__icon">📩</div>
          <h3>Check your email</h3>
          <p>If an account exists for <strong>${email.value.trim()}</strong>, a reset link is on its way.</p>
          <a href="/login.html" class="btn btn-primary" style="margin-top:20px">Back to Log In</a>
        </div>`;
    } catch (err) {
      toastError(err.message);
      btn.disabled = false; btn.textContent = 'Send Reset Link';
    }
  });
</script>
</body>
</html>

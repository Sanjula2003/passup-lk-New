<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — PassUp.LK</title>
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/pages/auth.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-visual">
    <a href="/index.html" class="brand" style="color:#fff"><span class="brand__mark">P</span><span>PassUp<span style="color:var(--color-primary)">.LK</span></span></a>
    <p class="auth-visual__quote">"Almost there — set a new password to get back to learning."</p>
  </div>
  <div class="auth-panel">
    <div class="auth-card">
      <div class="auth-card__head">
        <h2>Set a new password</h2>
        <p>Choose a strong password you haven't used before.</p>
      </div>
      <form id="resetForm" novalidate>
        <div class="field">
          <label for="password">New Password</label>
          <input class="input" type="password" id="password" required>
          <span class="field-hint">At least 8 characters, with a letter and a number.</span>
        </div>
        <div class="field">
          <label for="confirm">Confirm Password</label>
          <input class="input" type="password" id="confirm" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Update Password</button>
      </form>
    </div>
  </div>
</div>
<script type="module">
  import { updatePassword } from '/assets/js/services/auth.service.js';
  import { isStrongPassword, applyFieldError, clearFieldError } from '/assets/js/utils/validators.js';
  import { toastError, toastSuccess } from '/assets/js/utils/toast.js';

  // Supabase places the recovery token in the URL and establishes a
  // temporary session automatically via detectSessionInUrl (see supabase.js).

  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('password');
    const confirm = document.getElementById('confirm');
    [password, confirm].forEach(clearFieldError);

    let valid = true;
    if (!isStrongPassword(password.value)) { applyFieldError(password, 'Min 8 characters, with a letter and a number.'); valid = false; }
    if (password.value !== confirm.value) { applyFieldError(confirm, 'Passwords do not match.'); valid = false; }
    if (!valid) return;

    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = 'Updating…';
    try {
      await updatePassword(password.value);
      toastSuccess('Password updated! Please log in.');
      window.location.href = '/login.html';
    } catch (err) {
      toastError(err.message);
      btn.disabled = false; btn.textContent = 'Update Password';
    }
  });
</script>
</body>
</html>

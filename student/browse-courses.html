<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Courses — PassUp.LK</title>
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/pages/dashboard.css">
</head>

<body>
    <script type="module">
        import { requireStudent } from '/assets/js/utils/guards.js';
        import { renderAppShell } from '/assets/js/components/app-shell.js';
        import { listPublishedCourses } from '/assets/js/services/courses.service.js';
        import { listSubjects } from '/assets/js/services/subjects.service.js';
        import { courseCardHTML } from '/assets/js/components/course-card.js';
        import { escapeHTML, renderEmptyState, renderErrorState, qsa } from '/assets/js/utils/dom.js';

        const auth = await requireStudent();
        if (!auth) throw new Error('redirecting');
        const { profile } = auth;

        const content = renderAppShell({ role: 'student', profile, activeHref: '/student/browse-courses.html', pageTitle: 'All Courses' });
        content.innerHTML = `
    <div class="page-head"><h1>All Courses</h1></div>
    <div class="filter-bar" id="levelBar">
      <button class="btn btn-dark btn-sm" data-level="">All Levels</button>
      <button class="btn btn-outline btn-sm" data-level="O/L">O/L</button>
      <button class="btn btn-outline btn-sm" data-level="A/L">A/L</button>
    </div>
    <div class="filter-bar" id="subjectBar"></div>
    <div class="grid grid-3" id="grid">${'<div class="skeleton" style="height:280px"></div>'.repeat(3)}</div>
  `;

        const grid = document.getElementById('grid');
        const levelBar = document.getElementById('levelBar');
        const subjectBar = document.getElementById('subjectBar');

        let allSubjects = [];
        let activeLevel = '';
        let activeSubjectSlug = '';

        async function loadCourses() {
            grid.innerHTML = '<div class="skeleton" style="height:280px"></div>'.repeat(3);
            try {
                const courses = await listPublishedCourses({ subjectSlug: activeSubjectSlug || null, level: activeLevel || null });
                if (!courses.length) {
                    return renderEmptyState(grid, { icon: '📚', title: 'No courses here yet', message: 'Check back soon — new courses are added regularly.' });
                }
                // Course cards link to the public course detail page by default —
                // it already handles enroll / pending / approved / continue-learning
                // states correctly for a logged-in student, so no need to duplicate
                // that logic here.
                grid.innerHTML = courses.map((c) => courseCardHTML(c, { ctaLabel: 'View & Enroll' })).join('');
            } catch {
                renderErrorState(grid, 'Could not load courses.');
            }
        }

        function renderSubjectBar() {
            const scoped = activeLevel ? allSubjects.filter((s) => s.level === activeLevel) : allSubjects;
            if (activeSubjectSlug && !scoped.some((s) => s.slug === activeSubjectSlug)) activeSubjectSlug = '';

            subjectBar.innerHTML = `
      <button class="btn btn-sm ${!activeSubjectSlug ? 'btn-dark' : 'btn-outline'}" data-subject="">All Subjects</button>
      ${scoped.map((s) => `<button class="btn btn-sm ${activeSubjectSlug === s.slug ? 'btn-dark' : 'btn-outline'}" data-subject="${escapeHTML(s.slug)}">${escapeHTML(s.name)}</button>`).join('')}
    `;
            qsa('[data-subject]', subjectBar).forEach((btn) => {
                btn.addEventListener('click', () => {
                    activeSubjectSlug = btn.dataset.subject;
                    renderSubjectBar();
                    loadCourses();
                });
            });
        }

        function wireLevelButtons() {
            qsa('[data-level]', levelBar).forEach((btn) => {
                btn.classList.toggle('btn-dark', btn.dataset.level === activeLevel);
                btn.classList.toggle('btn-outline', btn.dataset.level !== activeLevel);
                btn.addEventListener('click', () => {
                    activeLevel = btn.dataset.level;
                    qsa('[data-level]', levelBar).forEach((b) => {
                        b.classList.toggle('btn-dark', b === btn);
                        b.classList.toggle('btn-outline', b !== btn);
                    });
                    renderSubjectBar();
                    loadCourses();
                });
            });
        }

        try {
            allSubjects = await listSubjects();
        } catch {
            // Subject filter is a non-essential enhancement — course list still loads without it.
        }
        wireLevelButtons();
        renderSubjectBar();
        loadCourses();
    </script>
</body>

</html>

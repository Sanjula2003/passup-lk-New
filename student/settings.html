<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — PassUp.LK</title>
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/layout.css">
</head>
<body>
<script type="module">
  import { requireStudent } from '/assets/js/utils/guards.js';
  import { renderAppShell } from '/assets/js/components/app-shell.js';
  import { updatePassword, signOut } from '/assets/js/services/auth.service.js';
  import { isStrongPassword, applyFieldError, clearFieldError } from '/assets/js/utils/validators.js';
  import { toastSuccess, toastError } from '/assets/js/utils/toast.js';

  const auth = await requireStudent();
  if (!auth) throw new Error('redirecting');
  const { profile } = auth;

  const content = renderAppShell({ role: 'student', profile, activeHref: '/student/settings.html', pageTitle: 'Settings' });
  content.innerHTML = `
    <div class="page-head"><h1>Settings</h1></div>
    <div class="card card-body" style="max-width:480px;margin-bottom:24px">
      <h3>Change Password</h3>
      <form id="pwForm" novalidate style="margin-top:16px">
        <div class="field">
          <label for="newPw">New Password</label>
          <input class="input" type="password" id="newPw" required>
        </div>
        <button class="btn btn-primary" type="submit" id="pwBtn">Update Password</button>
      </form>
    </div>
    <!-- 
    <div class="card card-body" style="max-width:480px">
      <h3>Session</h3>
      <p style="margin:12px 0">Log out of PassUp.LK on this device.</p>
      <button class="btn btn-outline" id="logoutBtn">Log Out</button>
    </div>
    -->
  `;

  document.getElementById('pwForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const newPw = document.getElementById('newPw');
    clearFieldError(newPw);
    if (!isStrongPassword(newPw.value)) { applyFieldError(newPw, 'Min 8 characters, with a letter and a number.'); return; }
    const btn = document.getElementById('pwBtn');
    btn.disabled = true; btn.textContent = 'Updating…';
    try {
      await updatePassword(newPw.value);
      toastSuccess('Password updated.');
      newPw.value = '';
    } catch (err) { toastError(err.message); }
    finally { btn.disabled = false; btn.textContent = 'Update Password'; }
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await signOut();
    window.location.href = '/login.html';
  });
</script>
</body>
</html>

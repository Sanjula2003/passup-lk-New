<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — PassUp.LK Teacher</title>
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/layout.css">
</head>
<body>
<script type="module">
  import { requireTeacher } from '/assets/js/utils/guards.js';
  import { renderAppShell } from '/assets/js/components/app-shell.js';
  import { getAllSettings, upsertSetting } from '/assets/js/services/settings.service.js';
  import { updatePassword } from '/assets/js/services/auth.service.js';
  import { toastSuccess, toastError } from '/assets/js/utils/toast.js';
  import { escapeHTML } from '/assets/js/utils/dom.js';
  import { isStrongPassword, applyFieldError, clearFieldError } from '/assets/js/utils/validators.js';

  const auth = await requireTeacher();
  if (!auth) throw new Error('redirecting');
  const { profile } = auth;

  const content = renderAppShell({ role: 'teacher', profile, activeHref: '/teacher/settings.html', pageTitle: 'Settings' });
  content.innerHTML = `<div class="skeleton" style="height:400px"></div>`;

  const settings = await getAllSettings();
  const bank = settings.bank_details ?? {};

  content.innerHTML = `
    <div class="page-head"><h1>Settings</h1></div>

    <div class="card card-body" style="max-width:520px;margin-bottom:24px">
      <h3>Payment Details</h3>
      <p style="font-size:0.85rem;margin-bottom:16px">Shown to students on the Payment Instructions page.</p>
      <form id="paymentForm">
        <div class="field"><label>WhatsApp Number</label><input class="input" id="wa" value="${escapeHTML(settings.whatsapp_number ?? '')}" placeholder="+94700000000"></div>
        <div class="field"><label>Bank Name</label><input class="input" id="bankName" value="${escapeHTML(bank.bank ?? '')}"></div>
        <div class="field"><label>Account Name</label><input class="input" id="accName" value="${escapeHTML(bank.account_name ?? '')}"></div>
        <div class="field"><label>Account Number</label><input class="input" id="accNumber" value="${escapeHTML(bank.account_number ?? '')}"></div>
        <div class="field"><label>Branch</label><input class="input" id="branch" value="${escapeHTML(bank.branch ?? '')}"></div>
        <button class="btn btn-primary" type="submit">Save Payment Details</button>
      </form>
    </div>

    <div class="card card-body" style="max-width:520px;margin-bottom:24px">
      <h3>Cashback Policy Text</h3>
      <form id="policyForm" style="margin-top:12px">
        <div class="field"><textarea class="input" id="policyText" rows="3">${escapeHTML(settings.cashback_policy ?? '')}</textarea></div>
        <button class="btn btn-primary" type="submit">Save Policy Text</button>
      </form>
    </div>

    <div class="card card-body" style="max-width:520px">
      <h3>Change Password</h3>
      <form id="pwForm" style="margin-top:12px">
        <div class="field"><label>New Password</label><input class="input" type="password" id="newPw" required></div>
        <button class="btn btn-primary" type="submit">Update Password</button>
      </form>
    </div>
  `;

  document.getElementById('paymentForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      await Promise.all([
        upsertSetting('whatsapp_number', document.getElementById('wa').value.trim()),
        upsertSetting('bank_details', {
          bank: document.getElementById('bankName').value.trim(),
          account_name: document.getElementById('accName').value.trim(),
          account_number: document.getElementById('accNumber').value.trim(),
          branch: document.getElementById('branch').value.trim(),
        }),
      ]);
      toastSuccess('Payment details saved.');
    } catch (err) { toastError(err.message); }
  });

  document.getElementById('policyForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      await upsertSetting('cashback_policy', document.getElementById('policyText').value.trim());
      toastSuccess('Policy text saved.');
    } catch (err) { toastError(err.message); }
  });

  document.getElementById('pwForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const newPw = document.getElementById('newPw');
    clearFieldError(newPw);
    if (!isStrongPassword(newPw.value)) { applyFieldError(newPw, 'Min 8 characters, with a letter and a number.'); return; }
    try { await updatePassword(newPw.value); toastSuccess('Password updated.'); newPw.value = ''; }
    catch (err) { toastError(err.message); }
  });
</script>
</body>
</html>
